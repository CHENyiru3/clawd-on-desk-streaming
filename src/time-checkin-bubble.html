<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body { padding: 8px; user-select: none; }

:root {
  --bg: rgba(255, 255, 255, 0.99);
  --border: rgba(24, 32, 46, 0.12);
  --shadow: 0 18px 42px rgba(20, 27, 38, 0.14), 0 3px 10px rgba(20, 27, 38, 0.08);
  --title: #4c6d9f;
  --time: #111827;
  --body: #223041;
  --detail: #64748b;
  --buttonBg: #eff6ff;
  --buttonHoverBg: #dbeafe;
  --buttonBorder: rgba(76, 109, 159, 0.22);
  --buttonHoverBorder: rgba(76, 109, 159, 0.34);
  --buttonText: #27466d;
  --buttonShadow: 0 8px 18px rgba(76, 109, 159, 0.14);
}

.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 18px 18px 14px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.26s ease, transform 0.3s ease;
}
.card.visible {
  opacity: 1;
  transform: translateY(0);
}
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.time-wrap {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.time {
  font-size: 48px;
  line-height: 0.95;
  letter-spacing: -0.04em;
  color: var(--time);
  font-weight: 700;
}
.meridiem {
  font-size: 15px;
  color: var(--title);
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.label {
  margin-top: 2px;
  font-size: 12px;
  color: var(--title);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
}
.message {
  margin-top: 10px;
  color: var(--body);
  font-size: 15px;
  line-height: 1.45;
}
.detail {
  margin-top: 10px;
  font-size: 11px;
  line-height: 1.35;
  color: var(--detail);
}
.detail:empty { display: none; }
.dismiss {
  background: var(--buttonBg);
  border: 1px solid var(--buttonBorder);
  border-radius: 999px;
  padding: 8px 14px;
  color: var(--buttonText);
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(76, 109, 159, 0.08);
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}
.dismiss:hover {
  background: var(--buttonHoverBg);
  border-color: var(--buttonHoverBorder);
  transform: translateY(-1px);
  box-shadow: var(--buttonShadow);
}
.dismiss:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px rgba(76, 109, 159, 0.12);
}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="header">
      <div>
        <div class="time-wrap">
          <div class="time" id="timeLabel"></div>
          <div class="meridiem" id="meridiem"></div>
        </div>
        <div class="label" id="title"></div>
      </div>
      <button class="dismiss" id="dismissBtn"></button>
    </div>
    <div class="message" id="message"></div>
    <div class="detail" id="detail"></div>
  </div>
<script>
const card = document.getElementById("card");
const timeLabelEl = document.getElementById("timeLabel");
const meridiemEl = document.getElementById("meridiem");
const titleEl = document.getElementById("title");
const messageEl = document.getElementById("message");
const detailEl = document.getElementById("detail");
const dismissBtn = document.getElementById("dismissBtn");

function reportHeight() {
  requestAnimationFrame(() => {
    window.timeCheckinBubbleAPI.reportHeight(card.offsetHeight + 16);
  });
}

function show(payload) {
  timeLabelEl.textContent = payload.timeLabel || "";
  meridiemEl.textContent = payload.meridiem || "";
  titleEl.textContent = payload.title || "Check-in";
  messageEl.textContent = payload.message || "";
  detailEl.textContent = payload.detail || "";
  dismissBtn.textContent = payload.dismissLabel || "Copy that Clawdie";
  card.classList.add("visible");
  reportHeight();
}

function hide() {
  card.classList.remove("visible");
}

dismissBtn.addEventListener("click", () => window.timeCheckinBubbleAPI.dismiss());
window.timeCheckinBubbleAPI.onShow(show);
window.timeCheckinBubbleAPI.onHide(hide);
</script>
</body>
</html>
